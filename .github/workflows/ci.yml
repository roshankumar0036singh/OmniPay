name: OmniPay CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build_and_test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Use Node.js 22.x
      uses: actions/setup-node@v3
      with:
        node-version: 22.x
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Build Backend
      run: npm run build --workspace=@omnipay/backend
      
    - name: Build Shared
      run: npm run build --workspace=@omnipay/shared
      
    - name: Run Tests (Backend)
      run: npx vitest run --passWithNoTests

    # Note: Plasmo build might need specific keys if publishing, 
    # but basic build check ensures no TS errors.
    - name: Build Extension
      run: npm run build --workspace=@omnipay/extension
